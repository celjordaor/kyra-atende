name: AUD-01 Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: ESLint
        run: pnpm exec next lint --no-cache
      - name: HTTP authorization smoke (unauthenticated)
        if: github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://www.kyraatende.com.br
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL
          const checks = [
            { method: 'PATCH', path: '/api/superadmin/tenants/00000000-0000-4000-8000-000000000000/status', body: { status: 'active' } },
            { method: 'PATCH', path: '/api/superadmin/email-templates/aud01_invalid_key', body: { subject: 'test', html: '<p>test</p>' } },
            { method: 'DELETE', path: '/api/superadmin/email-templates/aud01_invalid_key' },
            { method: 'GET', path: '/api/superadmin/ai-budgets' },
            { method: 'PATCH', path: '/api/superadmin/ai-budgets', body: { scope: 'plan', plan: 'essencial', monthly_budget_cents: 100 } },
            { method: 'DELETE', path: '/api/superadmin/ai-budgets', body: { tenant_id: '00000000-0000-4000-8000-000000000000' } },
            { method: 'POST', path: '/api/superadmin/asaas-payment-reviews', body: { paymentId: 'pay_aud01_dummy', status: 'reviewed', reason: 'other', note: 'Test only' } },
            { method: 'GET', path: '/api/superadmin/asaas-payment-status?paymentId=pay_aud01_dummy' },
            { method: 'GET', path: '/api/superadmin/whatsapp-reconciliation' },
          ]
          for (const test of checks) {
            const response = await fetch(base + test.path, {
              method: test.method,
              headers: { 'content-type': 'application/json' },
              body: test.body ? JSON.stringify(test.body) : undefined,
              redirect: 'manual',
            })
            const payload = await response.json().catch(() => null)
            console.log(test.method, test.path, response.status)
            if (response.status !== 401 || !payload ||
                !['Não autorizado', 'Nao autorizado'].includes(payload.message ?? payload.error)) {
              throw new Error('Expected application HTTP 401 JSON (not proxy-level 401), got ' + response.status)
            }
          }
          NODE
